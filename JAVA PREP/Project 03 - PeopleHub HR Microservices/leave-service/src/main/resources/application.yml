# Main configuration. Secrets and connection details come from the ENVIRONMENT (or application-local.yml, see README).
spring:
  application:
    name: leave-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate        # the schema is owned by database/*.sql; Hibernate only VERIFIES it
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
server:
  port: 8082
management:
  endpoints:
    web:
      exposure:
        include: health,info
