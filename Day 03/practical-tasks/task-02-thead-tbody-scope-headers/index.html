<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Day 03 — Task 02 — Scoped headers</title>
    <link rel="stylesheet" href="styles/main.css">
  </head>
  <body>
    <main>
      <h1>Inventory table</h1>
      <caption>Inventory of items</caption>
      <thead>
        <tr>
          <th scope="col">Item</th>
          <th scope="col">Qty</th>
          <th scope="col">Unit price</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row">Widget A</th>
          <td>100</td>
          <td>$10.00</td>
        </tr>
        <tr>
          <th scope="row">Widget B</th>
          <td>150</td>
          <td>$15.00</td>
        </tr>
        <tr>
          <th scope="row">Widget C</th>
          <td>200</td>
          <td>$20.00</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <th scope="row">Total</th>
          <td>450</td>
          <td>$45.00</td>
        </tr>
      </tfoot>
    </main>
  </body>
</html>
