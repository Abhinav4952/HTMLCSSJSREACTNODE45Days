<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Day 03 — Task 01 — Simple table</title>
    <link rel="stylesheet" href="styles/main.css">
  </head>
  <body>
    <main>
      <h1>Simple data table</h1>
      <table>
        <caption>Monthly Sales Data</caption>
        <thead>
          <tr>
            <th>Product</th>
            <th>Quantity</th>
            <th>Price</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Widget A</td>
            <td>100</td>
            <td>$10.00</td>
          </tr>
          <tr>
            <td>Widget B</td>
            <td>150</td>
            <td>$15.00</td>
          </tr>
          <tr>
            <td>Widget C</td>
            <td>200</td>
            <td>$20.00</td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
