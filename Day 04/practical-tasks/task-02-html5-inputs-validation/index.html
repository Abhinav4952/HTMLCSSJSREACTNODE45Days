<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Day 04 — Task 02 — Inputs</title>
    <link rel="stylesheet" href="styles/main.css">
  </head>
  <body>
    <main>
      <h1>Profile inputs</h1>
      <form method="post" action="#">
        <label for="homepage">Homepage:</label>
        <input type="url" id="homepage" name="homepage">

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone">

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="18" max="120">

        <label for="username">Username:</label>
        <input type="text" id="username" name="username" pattern="^[a-z0-9_]{3,15}$" required>
        <p class="hint">Username must be 3-15 characters long and can only contain lowercase letters, digits, and underscores.</p>

        <button type="submit">Submit</button>
      </form>
